[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitbook-md-to-xml"
version = "0.1.0"
description = "Convert GitBook Markdown into a platform-neutral XML document tree"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["markdown-it-py>=3,<5", "mdit-py-plugins>=0.4,<1", "PyYAML>=6,<7"]

[project.scripts]
gitbook-md-to-xml = "gitbook_md_to_xml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
